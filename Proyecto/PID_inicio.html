
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Barbería Robin's</title>
    <link rel="stylesheet" href="PID_CSS/PID_Menu_D.css">
    <link rel="stylesheet" href="PID_CSS/PID_inicio.css">
</head>
<body>

    	<div class="app">

        <div id="menu-root"></div>


        <main class="app-contenido">

            <!-- ENCABEZADO -->
            <header class="encabezado">

                <div class="titulo">
                    <h1>Inicio</h1>
                    <p>Resumen general del negocio</p>
                </div>  

                <div class="usuario">
                    <span class="usuario-icono">●</span>
                    <span>admin</span>
                    <span class="usuario-flecha">⌄</span>
                </div>

            </header>

            <!-- RECUADROS PRINCIPALES -->
            <section class="resumen">

                <article class="tarjeta ventas">
                    <div class="icono-tarjeta">
                        🛒
                    </div>

                    <div class="informacion">
                        <p>Total de ventas</p>
                        <h2></h2>
                        <span class="detalle"></span>
                    </div>
                </article>

                <article class="tarjeta gastos">
                    <div class="icono-tarjeta">
                        ▣
                    </div>

                    <div class="informacion">
                        <p>Total de gastos</p>
                        <h2></h2>
                        <span class="detalle"></span>
                    </div>
                </article>

                <article class="tarjeta ganancia">
                    <div class="icono-tarjeta">
                        ◷
                    </div>

                    <div class="informacion">
                        <p>Ganancia del día</p>
                        <h2></h2>
                        <span class="detalle"></span>
                    </div>
                </article>

                <article class="tarjeta inventario">
                    <div class="icono-tarjeta">
                        ⚠
                    </div>

                    <div class="informacion">
                        <p>Productos con poco stock</p>
                        <h2></h2>
                        <span class="detalle">Requieren reposición</span>
                    </div>
                </article>

            </section>

        </main>

    </div>
<script src="js/PID_menu_d.js"></script>
</body>
</html>
