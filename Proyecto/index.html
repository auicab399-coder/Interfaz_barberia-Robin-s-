
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="PID_CSS/PID_LOGIN_DISEÑO.css">
</head>
<body>

    <div class="contenedor-login">

        <div class="panel-logo">
            <img src="assents\img\Barbería Robin's.jpeg" alt="Barbería Robin's">
        </div>

        <div class="panel-formulario">
            <h1>Bienvenido</h1>

            <p class="descripcion">
                Ingresa tus credenciales para acceder al sistema
                administrativo de la barbería.
            </p>

            <form>
                <div class="campo">
                    <input type="text" placeholder="Usuario" required>
                </div>

                <div class="campo">
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <label class="recordar">
                    <input type="checkbox">
                    Recordar sesión
                </label>

                <button type="submit" class="boton-login">
                        <a href="PID_inicio.html">Iniciar sesion</a>
                </button>
            </form>

            <p class="aviso">Solo personal autorizado</p>
        </div>

    </div>

</body>
</html>
